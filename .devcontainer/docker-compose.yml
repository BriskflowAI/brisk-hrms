# The codespace: a Frappe workspace container plus the database and Redis it needs.
services:
  frappe:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on:
      - mariadb
      - redis

  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      # Only reachable from inside this codespace.
      MARIADB_ROOT_PASSWORD: briskrew-dev
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  mariadb-data:
