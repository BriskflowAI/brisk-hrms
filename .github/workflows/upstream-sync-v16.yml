name: Upstream sync (v16)

# Once a week, merge frappe/hrms version-16 into a branch off main (the production line, Frappe HR
# v16) and open a pull request into main, so production picks up upstream v16 fixes. The pull
# request runs the briskrew checks; a person merges it. If the merge conflicts, the run fails and
# lists the files to resolve by hand (see flow/UPSTREAM.md).
#
# GitHub runs scheduled workflows only from the default branch, which is main.
on:
  schedule:
    - cron: "53 3 * * 1" # Mondays 03:53 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream version-16
        id: merge
        run: |
          git config user.name "briskrew sync"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream https://github.com/frappe/hrms
          git fetch upstream version-16
          behind=$(git rev-list --count HEAD..upstream/version-16)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          if [ "$behind" = "0" ]; then echo "Already up to date."; exit 0; fi
          branch="sync/v16-upstream-$(date -u +%Y-%m-%d)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git checkout -b "$branch"
          if ! git merge --no-edit upstream/version-16; then
            echo "::error::Merging upstream version-16 conflicts in: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
            echo "Resolve by hand following flow/UPSTREAM.md."
            exit 1
          fi
          git push -u origin "$branch"

      - name: Open the pull request
        if: steps.merge.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${{ steps.merge.outputs.branch }}"
          # If Actions may not open pull requests, the branch is still pushed: leave a link.
          gh pr create --base main --head "$branch" \
            --title "chore: sync with upstream Frappe HR version-16 (${{ steps.merge.outputs.behind }} commits)" \
            --body "Merges frappe/hrms version-16 into main. Before merging: the briskrew checks pass, and run the screen audit on a v16 site (flow/UPSTREAM.md)." \
          || {
            url="${{ github.server_url }}/${{ github.repository }}/compare/main...$branch?expand=1"
            echo "::warning::Couldn't open the pull request. Open it here: $url"
            echo "Upstream merged into \`$branch\`. [Open the pull request]($url)" >> "$GITHUB_STEP_SUMMARY"
          }
          # Pull requests opened with the workflow token don't start other workflows, so start the
          # briskrew checks on the branch by hand; they show on the pull request.
          gh workflow run briskrew.yml --ref "$branch"
